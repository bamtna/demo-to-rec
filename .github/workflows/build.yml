name: build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: build/Release/demo-to-rec.exe
          - os: ubuntu-latest
            name: linux-x64
            exe: build/demo-to-rec
          - os: macos-latest
            name: macos-arm64
            exe: build/demo-to-rec
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: build
        run: cmake --build build --config Release --parallel
      - name: test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: package
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.exe }}" dist/
          cp README.md dist/
          cd dist && cmake -E tar cf ../demo-to-rec-${{ matrix.name }}.zip --format=zip .
      - uses: actions/upload-artifact@v4
        with:
          name: demo-to-rec-${{ matrix.name }}
          path: demo-to-rec-${{ matrix.name }}.zip

  # releases v<version> from CMakeLists.txt if it doesn't exist yet
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=v$(sed -n 's/^project(demo-to-rec VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if gh release view "$version" > /dev/null 2>&1; then
            echo "$version already released"
          else
            gh release create "$version" dist/*.zip --target "$GITHUB_SHA" --title "$version" --generate-notes
          fi
